<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Typing Quiz</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #00a884;
      --text: #e0e0e0;
      --input-bg: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }

    #game-container { width: 100%; max-width: 480px; height: 90vh; background: var(--card-bg); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

    header { background: #2d2d2d; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; color: var(--accent); border-bottom: 1px solid #333; }

    .scoreboard { padding: 12px 20px; background: #252525; border-bottom: 1px solid #333; font-size: 14px; max-height: 120px; overflow-y: auto; }
    .scoreboard h3 { margin-bottom: 6px; font-size: 13px; color: #888; text-transform: uppercase; }
    .player-score-row { display: flex; justify-content: space-between; padding: 3px 0; }

    .game-board { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 20px; text-align: center; }

    .question-box { font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; }
    .status-msg { font-size: 15px; min-height: 24px; color: #ffb74d; font-weight: bold; }

    /* Typing Answer Section */
    .answer-form { display: flex; gap: 8px; width: 100%; }
    #answer-input { flex: 1; padding: 14px 16px; font-size: 16px; border: 2px solid #444; border-radius: 8px; background: var(--input-bg); color: var(--text); outline: none; }
    #answer-input:focus { border-color: var(--accent); }
    #answer-input:disabled { background: #222; color: #555; border-color: #333; }

    .submit-btn { padding: 0 20px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .submit-btn:disabled { background: #444; color: #777; cursor: not-allowed; }

    .next-btn { padding: 12px 24px; background: #444; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
    .next-btn:hover { background: #555; }
  </style>
</head>
<body>

  <div id="game-container">
    <header>🧠 Typing Quiz Battle</header>

    <div class="scoreboard">
      <h3>Live Scoreboard</h3>
      <div id="players-list">Waiting for players...</div>
    </div>

    <div class="game-board">
      <div id="question-container">
        <div id="q-number" style="font-size: 12px; color: #888; margin-bottom: 8px;">QUESTION 1</div>
        <div id="question-text" class="question-box">Connecting to server...</div>
      </div>

      <div id="announcement" class="status-msg"></div>

      <form id="answer-form" class="answer-form" onsubmit="submitAnswer(event)">
        <input type="text" id="answer-input" autocomplete="off" placeholder="Type your answer..." required />
        <button type="submit" id="submit-btn" class="submit-btn">Send</button>
      </form>

      <button class="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const username = prompt("Enter your gamer tag:") || "Anonymous";
    
    socket.emit('join game', username);

    const answerInput = document.getElementById('answer-input');
    const submitBtn = document.getElementById('submit-btn');
    const questionText = document.getElementById('question-text');
    const qNumber = document.getElementById('q-number');
    const announcement = document.getElementById('announcement');
    const playersList = document.getElementById('players-list');

    function submitAnswer(e) {
      e.preventDefault();
      const val = answerInput.value.trim();
      if (val) {
        socket.emit('submit answer', val);
        answerInput.value = '';
      }
    }

    function nextQuestion() {
      socket.emit('next question');
    }

    socket.on('update players', (players) => {
      let html = '';
      for (let id in players) {
        html += `<div class="player-score-row"><span>${players[id].name}</span> <strong>${players[id].score} pts</strong></div>`;
      }
      playersList.innerHTML = html || 'No players online';
    });

    socket.on('new question', (data) => {
      qNumber.textContent = `QUESTION ${data.questionNumber}`;
      questionText.textContent = data.questionText;
      announcement.textContent = '';
      answerInput.disabled = data.roundOver;
      submitBtn.disabled = data.roundOver;
      answerInput.placeholder = "Type your answer...";
    });

    socket.on('wrong answer notification', () => {
      announcement.textContent = "❌ Incorrect! You are locked out of this question.";
      answerInput.disabled = true;
      submitBtn.disabled = true;
    });

    socket.on('round winner', (data) => {
      answerInput.disabled = true;
      submitBtn.disabled = true;
      announcement.textContent = `🎉 Correct! ${data.name} won the point! Answer was: ${data.answer}`;

      let html = '';
      for (let id in data.players) {
        html += `<div class="player-score-row"><span>${data.players[id].name}</span> <strong>${data.players[id].score} pts</strong></div>`;
      }
      playersList.innerHTML = html;
    });

    socket.on('round draw', (data) => {
      answerInput.disabled = true;
      submitBtn.disabled = true;
      announcement.textContent = `⚠️ Everyone got it wrong! No points awarded. Answer was: ${data.answer}`;
    });
  </script>
</body>
</html>
