<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Quiz Buzzer</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #bb86fc;
      --text: #e0e0e0;
      --buzzer-red: #ff4444;
      --buzzer-active: #cc0000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }

    #game-container { width: 100%; max-width: 480px; height: 90vh; background: var(--card-bg); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

    header { background: #2d2d2d; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; color: var(--accent); border-bottom: 1px solid #333; }

    .scoreboard { padding: 12px 20px; background: #252525; border-bottom: 1px solid #333; font-size: 14px; max-height: 120px; overflow-y: auto; }
    .scoreboard h3 { margin-bottom: 6px; font-size: 13px; color: #888; text-transform: uppercase; }
    .player-score-row { display: flex; justify-content: space-between; padding: 3px 0; }

    .game-board { flex: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 20px; text-align: center; }

    .question-box { font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; }
    .status-msg { font-size: 16px; min-height: 24px; color: #ffb74d; font-weight: bold; }

    /* Giant Arcade Buzzer Button */
    #buzzer-btn { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #ff6b6b 0%, var(--buzzer-red) 70%); border: 8px solid #ff8080; color: white; font-size: 28px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 0 #990000, 0 15px 25px rgba(0,0,0,0.5); transition: transform 0.1s, box-shadow 0.1s; display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: 2px; }
    #buzzer-btn:active:not(:disabled) { transform: translateY(8px); box-shadow: 0 2px 0 #990000, 0 5px 10px rgba(0,0,0,0.5); }
    #buzzer-btn:disabled { background: #444; border-color: #555; color: #777; box-shadow: none; cursor: not-allowed; transform: translateY(8px); }

    .next-btn { padding: 12px 24px; background: var(--accent); color: #121212; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .next-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div id="game-container">
    <header>🎮 Quiz Buzzer Battle</header>

    <div class="scoreboard">
      <h3>Live Scoreboard</h3>
      <div id="players-list">Waiting for players...</div>
    </div>

    <div class="game-board">
      <div id="question-container">
        <div id="q-number" style="font-size: 12px; color: #888; margin-bottom: 8px;">QUESTION 1</div>
        <div id="question-text" class="question-box">Connecting to server...</div>
      </div>

      <div id="announcement" class="status-msg"></div>

      <button id="buzzer-btn" onclick="hitBuzzer()" disabled>BUZZ!</button>

      <button class="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const username = prompt("Enter your gamer tag:") || "Anonymous";
    
    socket.emit('join game', username);

    const buzzerBtn = document.getElementById('buzzer-btn');
    const questionText = document.getElementById('question-text');
    const qNumber = document.getElementById('q-number');
    const announcement = document.getElementById('announcement');
    const playersList = document.getElementById('players-list');

    function hitBuzzer() {
      socket.emit('hit buzzer');
    }

    function nextQuestion() {
      socket.emit('next question');
    }

    socket.on('update players', (players) => {
      let html = '';
      for (let id in players) {
        html += `<div class="player-score-row"><span>${players[id].name}</span> <strong>${players[id].score} pts</strong></div>`;
      }
      playersList.innerHTML = html || 'No players online';
    });

    socket.on('new question', (data) => {
      qNumber.textContent = `QUESTION ${data.questionNumber}`;
      questionText.textContent = data.questionText;
      announcement.textContent = '';
      buzzerBtn.disabled = data.locked;
    });

    socket.on('buzzer winner', (data) => {
      buzzerBtn.disabled = true;
      announcement.textContent = `🚨 ${data.name} buzzed first! Answer: ${data.answer}`;

      let html = '';
      for (let id in data.players) {
        html += `<div class="player-score-row"><span>${data.players[id].name}</span> <strong>${data.players[id].score} pts</strong></div>`;
      }
      playersList.innerHTML = html;
    });
  </script>
</body>
</html>
